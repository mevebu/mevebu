name: release

# Publishes to npm when a version tag is pushed (for example by `npm run ship`).
# Uses npm Trusted Publishing (OIDC), so no NPM_TOKEN secret is needed and no
# 2FA prompt blocks the release.
#
# Setup once on npm:
#   npmjs.com -> package "mevebu" -> Settings -> Trusted Publisher -> GitHub Actions
#   Organization or user : mevebu
#   Repository           : mevebu
#   Workflow filename    : release.yml
#   Environment          : (leave empty)
#   Allowed actions      : npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Trusted Publishing needs a recent npm (>= 11.5). Node 20 ships npm 10.
      # No NODE_AUTH_TOKEN is used: npm authenticates through OIDC.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
